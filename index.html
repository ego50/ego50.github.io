<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>Mon classeur numérique</title>
</head>
<body>
  <div class="sakura-container" aria-hidden="true"></div>
  <div class="sakura-energy" aria-hidden="true"></div>
  <div class="dragon-zone" aria-hidden="true"><div class="dragon"></div></div>

  <header>
    <h1>Mon classeur numérique</h1>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="cours.php">Cours</a>
      <a href="tp.php">Mes TP</a>
      <a href="projets.php">Projets</a>
      <a href="documents.php">Documents</a>
    </nav>
  </header>

  <main>
    <h2>Bienvenue</h2>
    <p>Ce site me permettra d'organiser mes ressources de SIN.</p>
  </main>

  <script>
    const sakuraContainer = document.querySelector(".sakura-container");
    const PETAL_COUNT = 42;
    for (let i = 0; i < PETAL_COUNT; i++) {
      const petal = document.createElement("span");
      petal.className = "sakura-petal";
      petal.style.left = `${Math.random() * 100}%`;
      petal.style.setProperty("--fall", `${14 + Math.random() * 13}s`);
      petal.style.setProperty("--delay", `${Math.random() * -24}s`);
      petal.style.setProperty("--drift1", `${-80 + Math.random() * 160}px`);
      petal.style.setProperty("--drift2", `${-100 + Math.random() * 200}px`);
      petal.style.setProperty("--drift3", `${-120 + Math.random() * 240}px`);
      petal.style.setProperty("--drift4", `${-100 + Math.random() * 200}px`);
      sakuraContainer.appendChild(petal);
    }

    const dragon = document.querySelector(".dragon");
    const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)");
    if (finePointer.matches) {
      let targetX = 0, targetY = 0, currentX = 0, currentY = 0;
      window.addEventListener("pointermove", (event) => {
        targetX = (event.clientX / window.innerWidth - 0.5) * 22;
        targetY = (event.clientY / window.innerHeight - 0.5) * 14;
      }, { passive: true });
      function parallax() {
        currentX += (targetX - currentX) * 0.025;
        currentY += (targetY - currentY) * 0.025;
        dragon.style.setProperty("--mx", `${currentX}px`);
        dragon.style.setProperty("--my", `${currentY}px`);
        requestAnimationFrame(parallax);
      }
      parallax();
    }
  </script>
</body>
</html>
